[project]
name = "chevuoi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ishida", email = "ishida@laboro.ai" }
]
requires-python = ">=3.12"
dependencies = [
    "injector>=0.22.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "langgraph>=0.2",
    "langchain-core>=0.3",
]

[project.scripts]
vuoi = "chevuoi.interfaces.cli.main:main"

[tool.uv.build-backend]
module-name = ["chevuoi", "vuoi_sdk"]

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "furo>=2025.12.19",
    "myst-parser>=5.1.0",
    "pytest>=9.1.1",
    "sphinx>=9.1.0",
]
